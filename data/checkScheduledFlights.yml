- intent: change_departure_iata
  examples: |
    - Change my departure airport to [LHR]{"entity": "iata", "role": "departure"}.
    - I meant to fly out of [JFK]{"entity": "iata", "role": "departure"}, not [LAX]{"entity": "iata", "role": "departure"}.
    - Can I change my departure to [ORD]{"entity": "iata", "role": "departure"}?
