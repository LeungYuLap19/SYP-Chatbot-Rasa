    - Switch my departure location to [SFO]{"entity": "iata", "role": "departure"}.
    - Actually, I want to depart from [MIA]{"entity": "iata", "role": "departure"}.
    - I need to change the departure to [SEA]{"entity": "iata", "role": "departure"}.
    - Update the departure airport to [BOM]{"entity": "iata", "role": "departure"}.
    - My flight is now leaving from [DXB]{"entity": "iata", "role": "departure"} instead.
    - Please modify my departure to [SYD]{"entity": "iata", "role": "departure"}.

