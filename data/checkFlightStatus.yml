version: "3.1"

nlu:

- regex: flight_number
  examples: |
    - [A-Z]{2}\\d+

- intent: check_flight_status
  examples: |
    - check flight [AA100]{"entity": "flight_number"} on [15-03-2025]{"entity": "date"}
    - what is the status of flight [BA256]{"entity": "flight_number"} [tomorrow]{"entity": "date"}
    - track flight [SQ318]{"entity": "flight_number"} [next monday]{"entity": "date"}
    - is flight [EK501]{"entity": "flight_number"} on time [this weekend]{"entity": "date"}
    - flight status for [LH760]{"entity": "flight_number"} [in two days]{"entity": "date"}
    - tell me about flight [QR908]{"entity": "flight_number"} [next week]{"entity": "date"}
    - I need to check flight [DL404]{"entity": "flight_number"} [friday]{"entity": "date"}
    - is [AF102]{"entity": "flight_number"} delayed [the day after tomorrow]{"entity": "date"}
    - find status of [QF63]{"entity": "flight_number"} [15 march 2025]{"entity": "date"}
    - how is flight [CX101]{"entity": "flight_number"} doing [today]{"entity": "date"}
    - any update on flight [VS400]{"entity": "flight_number"} [next tuesday]{"entity": "date"}
    - status of [AI187]{"entity": "flight_number"} [15-03-2025]{"entity": "date"}
    - track [KLM601]{"entity": "flight_number"} [next wednesday]{"entity": "date"}
    - tell me about flight [AC854]{"entity": "flight_number"} [21 days later]{"entity": "date"}
    - I want to check [JL44]{"entity": "flight_number"} status [next saturday]{"entity": "date"}
    - what's happening with [NH223]{"entity": "flight_number"} [05-03-2025]{"entity": "date"}
    - update on [UA837]{"entity": "flight_number"} [next friday]{"entity": "date"}
    - check if [SW123]{"entity": "flight_number"} is delayed [20-03-2025]{"entity": "date"}
    - status update for flight [TG916]{"entity": "flight_number"} [7 days later]{"entity": "date"}
    - is [ET500]{"entity": "flight_number"} on schedule [next month]{"entity": "date"}
    - what's the update on flight [BA175]{"entity": "flight_number"} [next sunday]{"entity": "date"}
    - I need status for [QR815]{"entity": "flight_number"} [25-12-2025]{"entity": "date"}
    - show me details for [EK407]{"entity": "flight_number"} [today]{"entity": "date"}
    - tell me about [LH430]{"entity": "flight_number"} [next thursday]{"entity": "date"}
    - when is [AA321]{"entity": "flight_number"} arriving [tomorrow]{"entity": "date"}
    - find flight [CX580]{"entity": "flight_number"} [14 days later]{"entity": "date"}
    - I need flight info for [SQ932]{"entity": "flight_number"} [31-12-2025]{"entity": "date"}
    - tell me if [JL723]{"entity": "flight_number"} is on time [today]{"entity": "date"}
    - update me on [AF890]{"entity": "flight_number"} [14-02-2026]{"entity": "date"}
    - when will [UA100]{"entity": "flight_number"} land [tomorrow]{"entity": "date"}

- intent: change_flight_number
  examples: |
    - How about [LH778]{"entity": "flight_number"}.
    - Actually, I meant [CX271]{"entity": "flight_number"} instead.
    - Wait, change it to [EK205]{"entity": "flight_number"}.
    - No, I was asking about [BA290]{"entity": "flight_number"}.
    - Oops, I meant [SQ905]{"entity": "flight_number"}.
    - Can you check [AA250]{"entity": "flight_number"} instead?

- intent: change_flight_date
  examples: |
    - How about [next week]{"entity": "date"}?
    - Actually, I meant [tomorrow]{"entity": "date"}.
    - Wait, can you check for [next friday]{"entity": "date"} instead?
    - No, I need it [two days later]{"entity": "date"}.
    - Oops, I was asking about [the day after tomorrow]{"entity": "date"}.
    - Sorry, check [next saturday]{"entity": "date"} instead.
    - Change it to [next monday]{"entity": "date"}.
    - Can we look at [15-03-2025]{"entity": "date"} instead?
    - I meant [7 days later]{"entity": "date"}.
    - Actually, check [20-03-2025]{"entity": "date"}.